<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your RIO password</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f1ec;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;margin:0;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#fffcf7;border:1px solid #dcd6cc;border-radius:18px;">
            <tr>
              <td style="padding:32px 28px 28px;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;color:#121110;">
                <p style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#E25A32;">RIO</p>
                <h1 style="margin:0 0 12px;font-size:28px;line-height:1.15;font-weight:800;color:#121110;">Reset your password</h1>
                <p style="margin:0 0 20px;font-size:16px;line-height:1.5;color:#121110;">Choose a new password for your RIO account. The link expires after a short time. If you did not ask for this, you can ignore this email.</p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 20px;">
                  <tr>
                    <td style="border-radius:999px;background:#C2461F;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;color:#ffffff;text-decoration:none;">Reset password</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 8px;font-size:14px;line-height:1.5;color:#6e6a64;">If the button does not open, paste this link into your browser:</p>
                <p style="margin:0;font-size:14px;line-height:1.5;word-break:break-all;"><a href="{{ .ConfirmationURL }}" style="color:#E25A32;">{{ .ConfirmationURL }}</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
